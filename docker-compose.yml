services:
  at-autoservices:
    build: .
    container_name: at-autoservices
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      HOST: 0.0.0.0
      PORT: "80"
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "465"
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      QUOTE_TO: ${QUOTE_TO:-a.tautoservices3@gmail.com}
    networks:
      - default
      - proxy

networks:
  proxy:
    external: true
    name: orcait_default
